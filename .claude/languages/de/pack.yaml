# Language pack: German (spec §4.5). Read by Claude, not by hooks: full YAML.
#
# Resolution for a prose file with tag <tag> (e.g. de-AT):
#   base files here  →  variants/<tag>.md if it exists (wins where they differ)
# Option values in force, highest first:
#   work.yaml language_options → studio.yaml language.options
#   → variants.<tag>.defaults → options.<name>.default
#
# The pack's instructions are written in English (for agents, whatever the
# interface language); examples are German.

schema_version: 1
language: de
name: Deutsch (German)
support: supported            # supported | user-defined

files:
  conventions: conventions.md # orthography authority, punctuation, typography, numbers, dates
  grammar: grammar.md         # what grammar-editor checks and how
  style: style.md             # line-editing notes
  academic: academic.md       # academic conventions

# Marks a quotation the author translated themselves (spec §6.1).
translation_marker: "eigene Übersetzung"

options:
  gendering:
    description: "How person nouns refer to mixed or unknown genders. none: no gender markers (the author's own neutral or generic forms are left alone); colon: Leser:innen; asterisk: Leser*innen; pair-forms: Leserinnen und Leser."
    values: [none, colon, asterisk, pair-forms]
    default: none

variants:
  de-DE:
    overlay: variants/de-DE.md
    csl_locale: de-DE         # /publish: Pandoc `lang` (also selects the LaTeX language)
  de-AT:
    overlay: variants/de-AT.md
    csl_locale: de-AT
  de-CH:
    overlay: variants/de-CH.md
    csl_locale: de-CH

# Tag with no overlay (e.g. de-LI, de-LU): base files and option defaults only.
fallback_csl_locale: de-DE
