# Citation styles (§8.4). `ieee` is bundled in `.claude/csl/`. Any other style
# id is fetched once by /publish, with approval, from this pinned commit:
#   <raw_url>/<style-id>.csl   (dependent styles: <raw_url>/dependent/<style-id>.csl)
# and kept in `.claude/csl/`.
csl:
  repository: https://github.com/citation-style-language/styles
  commit: af0aea3fffd44fe798cce9285598d0d5cf62ef23   # 2026-11-06
  raw_url: https://raw.githubusercontent.com/citation-style-language/styles/af0aea3fffd44fe798cce9285598d0d5cf62ef23
  bundled:
    ieee:
      file: ieee.csl
      sha256: b4c7619fc16c45a31e4cc3271eab94ffe83192d3b4c7fc729470a3b459448de3
      licence: CC BY-SA 3.0
  # Styles fetched by /publish (scripts/csl-fetch.sh), recorded here with
  # approval; publish.sh refuses a .csl whose hash does not match. Shape:
  #   <style-id>:
  #     file: <style-id>.csl
  #     sha256: <hash>
  #     parent: <id>        # dependent styles only; the parent is fetched too
  fetched:
